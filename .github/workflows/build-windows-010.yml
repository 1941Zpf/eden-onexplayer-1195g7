name: Build Windows OneXPlayer 1195G7 019

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Free disk space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\ghcup" -ErrorAction SilentlyContinue

      - name: Install build tools
        shell: pwsh
        run: |
          choco install ninja cmake vulkan-sdk -y --no-progress
          $roots = @("C:\VulkanSDK", "C:\ProgramData\chocolatey\lib\vulkan-sdk", "$env:ProgramFiles\VulkanSDK")
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          if ($programFilesX86) {
            $roots += (Join-Path $programFilesX86 "VulkanSDK")
          }
          $glslang = Get-ChildItem -Path $roots -Filter glslangValidator.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $glslang) {
            throw "glslangValidator.exe was not found after installing vulkan-sdk"
          }
          Write-Host "Found glslangValidator: $($glslang.FullName)"
          $glslang.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show tool versions
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Current directory: $(Get-Location)"
          git rev-parse HEAD
          git status --short --branch
          cmake --version
          ninja --version
          Get-Command cl -ErrorAction SilentlyContinue
          Get-Command glslangValidator -ErrorAction Stop
          Get-ChildItem "$env:GITHUB_WORKSPACE\tools\windows" -Force
          Test-Path "$env:GITHUB_WORKSPACE\tools\windows\build-onexplayer-1195g7-010.ps1"

      - name: Build Eden OneXPlayer 019
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          $script = Join-Path $env:GITHUB_WORKSPACE "tools\windows\build-onexplayer-1195g7-010.ps1"
          if (-not (Test-Path $script)) {
            Write-Host "Repository root listing:"
            Get-ChildItem $env:GITHUB_WORKSPACE -Force
            throw "Build script was not found: $script"
          }
          & $script

      - name: Verify artifact package
        shell: pwsh
        run: |
          $artifact = Join-Path $env:GITHUB_WORKSPACE "artifacts\Eden-Windows-onexplayer-1195g7-019.zip"
          if (-not (Test-Path $artifact)) {
            Write-Host "Repository root listing:"
            Get-ChildItem $env:GITHUB_WORKSPACE -Force
            Write-Host "Artifacts directory listing:"
            Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "artifacts") -Force -ErrorAction SilentlyContinue
            throw "Expected artifact was not created: $artifact"
          }
          $item = Get-Item $artifact
          if ($item.Length -le 0) {
            throw "Artifact exists but is empty: $artifact"
          }
          Write-Host "Verified artifact: $artifact ($($item.Length) bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Windows-onexplayer-1195g7-019
          path: ${{ github.workspace }}/artifacts/Eden-Windows-onexplayer-1195g7-019.zip
          if-no-files-found: error
          retention-days: 14
