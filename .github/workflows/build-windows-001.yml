name: Build Windows OneXPlayer 1195G7 001

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Free disk space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\ghcup" -ErrorAction SilentlyContinue

      - name: Install build tools
        shell: pwsh
        run: |
          choco install ninja cmake vulkan-sdk -y --no-progress

      - name: Show tool versions
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Current directory: $(Get-Location)"
          git rev-parse HEAD
          git status --short --branch
          cmake --version
          ninja --version
          Get-Command cl -ErrorAction SilentlyContinue
          Get-ChildItem "$env:GITHUB_WORKSPACE\tools\windows" -Force
          Test-Path "$env:GITHUB_WORKSPACE\tools\windows\build-onexplayer-1195g7-001.ps1"

      - name: Build Eden OneXPlayer 001
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          $script = Join-Path $env:GITHUB_WORKSPACE "tools\windows\build-onexplayer-1195g7-001.ps1"
          if (-not (Test-Path $script)) {
            Write-Host "Repository root listing:"
            Get-ChildItem $env:GITHUB_WORKSPACE -Force
            throw "Build script was not found: $script"
          }
          & $script

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Windows-onexplayer-1195g7-001
          path: artifacts/Eden-Windows-onexplayer-1195g7-001.zip
